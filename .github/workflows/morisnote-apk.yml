name: Build Morisnote APK

# Personal build for sideloading onto the user's tablet.
# Flutter cannot AOT-build Android on a Linux arm64 host, so the APK is built here.

on:
  workflow_dispatch:
  push:
    branches: [personal, ci, main]

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        run: |
          set -euo pipefail
          df -h /
          # The Rust build (super_clipboard) needs several GB; the runner image
          # ships ~20 GB of toolchains this build never uses.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Add swap (the runner has 16 GB RAM; Gradle + Rust + Kotlin need more)
        run: |
          set -euo pipefail
          sudo fallocate -l 8G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Cache pub + gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: morisnote-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            morisnote-

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::SIGNING_KEY secret is missing"; exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > android/android.keystore
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "storeFile=../android.keystore"
          } > android/key.properties

      - name: Configure Android SDK / NDK / JDK
        run: |
          set -euo pipefail
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK: $NDK_DIR"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          fi

      - name: Flutter version
        run: |
          flutter --version
          flutter config --no-cli-animations

      - name: Analyze (errors only, fail fast)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Stamp the build number into the app (Settings → About shows it)
        run: |
          set -euo pipefail
          sed -i "s/^const buildNumber = .*/const buildNumber = ${{ github.run_number }};/" lib/data/version.dart
          grep -n "^const buildNumber" lib/data/version.dart

      - name: Build APK (signed, personal flavour)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number="${{ github.run_number }}" \
            --dart-define=FLAVOR="Morisnote personal" \
            --dart-define=APP_STORE="sideload" \
            --dart-define=UPDATE_CHECK=false

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk \
             "output/Morisnote-$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)-build${{ github.run_number }}.apk"
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Morisnote-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish to the rolling "latest" release (download link for the tablet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls output/*.apk | head -1)
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest "$APK" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Morisnote — build terbaru" \
            --notes "APK arm64 untuk sideload di tablet. Build #${{ github.run_number }}, commit ${GITHUB_SHA:0:7}. Pasang di atas build sebelumnya (tanda tangan sama, catatan aman)."
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/latest"
